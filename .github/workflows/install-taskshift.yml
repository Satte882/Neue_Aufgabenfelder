name: Install TASKSHIFT app

on:
  push:
    branches: [main]
    paths:
      - '.bundle/READY'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and unpack application
        shell: bash
        run: |
          set -euo pipefail
          cat .bundle/chunk-* > /tmp/taskshift.b64
          base64 --decode /tmp/taskshift.b64 > /tmp/taskshift_bundle.tar.gz
          tar -xzf /tmp/taskshift_bundle.tar.gz -C .
          rm -rf .bundle

      - name: Verify model tests
        shell: bash
        run: |
          npm run check

      - name: Commit finished app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy complete TASKSHIFT app"
            git push
          fi
